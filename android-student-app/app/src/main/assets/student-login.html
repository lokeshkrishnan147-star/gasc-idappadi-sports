<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Login — GASC Idappadi Sports</title>
  <script src="js/config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #071524 0%, #0f3460 50%, #071524 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.25rem;
      padding-top: env(safe-area-inset-top, 1.5rem);
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .header { text-align: center; margin-bottom: 1.5rem; }
    .logo {
      width: 70px; height: 70px; border-radius: 50%;
      object-fit: contain; margin-bottom: 0.75rem;
      background: #fff; padding: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .college-name { font-size: 1rem; font-weight: 800; color: #1e293b; letter-spacing: -0.5px; }
    .college-tamil { font-size: 0.72rem; color: #0d6efd; font-weight: 600; margin-top: 2px; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      background: rgba(13,110,253,0.1); color: #0d6efd;
      border: 1px solid rgba(13,110,253,0.25);
      padding: 0.3rem 0.8rem; border-radius: 50px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-top: 0.75rem;
    }

    .demo-box {
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 12px; padding: 0.75rem 1rem;
      margin-bottom: 1.25rem; display: flex;
      align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    .demo-text { font-size: 0.72rem; color: #166534; line-height: 1.5; }
    .demo-text strong { color: #15803d; }
    .btn-auto { background: #16a34a; color: #fff; border: none;
      border-radius: 8px; padding: 0.35rem 0.75rem; font-size: 0.72rem;
      font-weight: 700; cursor: pointer; white-space: nowrap; }

    .alert {
      border-radius: 10px; padding: 0.7rem 1rem;
      font-size: 0.8rem; margin-bottom: 1rem; display: none;
    }
    .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
    .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: block; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.78rem; font-weight: 700; color: #374151; margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.8rem 1rem; border: 2px solid #e5e7eb;
      border-radius: 12px; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s; background: #f9fafb;
      -webkit-appearance: none; appearance: none;
    }
    input:focus { border-color: #0d6efd; background: #fff; }
    .input-wrap { position: relative; }
    .eye-btn {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 0.25rem;
      color: #6b7280; font-size: 1.1rem; line-height: 1;
    }

    .forgot { text-align: right; margin-top: -0.5rem; margin-bottom: 1rem; }
    .forgot a { font-size: 0.75rem; color: #0d6efd; text-decoration: none; font-weight: 600; }

    .btn-submit {
      width: 100%; padding: 0.9rem; border: none;
      background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
      color: #fff; border-radius: 14px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s; display: flex;
      align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 4px 16px rgba(13,110,253,0.4);
    }
    .btn-submit:active { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { text-align: center; margin: 1.25rem 0; font-size: 0.78rem; color: #9ca3af; position: relative; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #e5e7eb;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .register-link { text-align: center; }
    .register-link p { font-size: 0.8rem; color: #6b7280; margin-bottom: 0.5rem; }
    .btn-register {
      display: block; width: 100%; padding: 0.8rem; text-align: center;
      background: transparent; border: 2px solid #0d6efd; color: #0d6efd;
      border-radius: 14px; font-size: 0.9rem; font-weight: 700;
      text-decoration: none; transition: all 0.2s;
    }
    .btn-register:active { background: rgba(13,110,253,0.1); }

    /* OTP Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 1000;
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff; border-radius: 20px; padding: 1.5rem;
      width: 100%; max-width: 360px;
    }
    .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; color: #1e293b; }
    .modal-close { float: right; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="images/college-logo.png" class="logo" alt="GASC Logo" onerror="this.style.display='none'">
      <div class="college-name">GASC IDAPPADI</div>
      <div class="college-tamil">அரசு கலை மற்றும் அறிவியல் கல்லூரி, எடப்பாடி</div>
      <span class="badge">🎓 Student Sports Portal</span>
    </div>

    <div class="demo-box">
      <div class="demo-text">
        <strong>Demo:</strong> Reg: <strong>23UGCS101</strong> · Pass: <strong>student123</strong>
      </div>
      <button class="btn-auto" onclick="fillDemo()">Auto Fill</button>
    </div>

    <div id="alert-box" class="alert"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="regno">📋 Register Number</label>
        <input type="text" id="regno" placeholder="e.g. 23UGCS101" required
          autocomplete="username" style="text-transform:uppercase;"
          oninput="this.value=this.value.toUpperCase()">
      </div>

      <div class="form-group">
        <label for="password">🔑 Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePwd()">👁</button>
        </div>
      </div>

      <div class="forgot">
        <a href="javascript:void(0)" onclick="showForgot()">Forgot Password?</a>
      </div>

      <button type="submit" id="btn-login" class="btn-submit">
        <span id="btn-text">Sign In →</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div class="divider">or</div>

    <div class="register-link">
      <p>New student athlete?</p>
      <a href="student-register.html" class="btn-register">📝 Register Account</a>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeForgot()">✕</button>
      <div class="modal-title">🔒 Reset Password</div>
      <p style="font-size:0.8rem;color:#6b7280;margin-bottom:1rem;">Enter your Register Number or Email to get OTP.</p>
      <div class="form-group">
        <label>Register Number / Email</label>
        <input type="text" id="reset-id" placeholder="e.g. 23UGCS101">
      </div>
      <div id="reset-alert" class="alert"></div>
      <button class="btn-submit" onclick="sendReset()">Send OTP</button>
    </div>
  </div>

  <script>
    // Check already logged in
    (function() {
      const t = localStorage.getItem('gasc_token');
      const u = localStorage.getItem('gasc_user');
      if (t && u) {
        try {
          if (JSON.parse(u).role === 'student') {
            location.replace('student-dashboard.html');
          } else {
            localStorage.removeItem('gasc_token');
            localStorage.removeItem('gasc_user');
          }
        } catch(e) {}
      }
    })();

    function fillDemo() {
      document.getElementById('regno').value = '23UGCS101';
      document.getElementById('password').value = 'student123';
    }

    function togglePwd() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alert-box');
      el.className = 'alert alert-' + type;
      el.textContent = msg;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const txt = document.getElementById('btn-text');
      const sp = document.getElementById('spinner');
      const regno = document.getElementById('regno').value.trim().toUpperCase();
      const password = document.getElementById('password').value;

      btn.disabled = true; txt.style.display = 'none'; sp.style.display = 'block';
      document.getElementById('alert-box').className = 'alert';

      try {
        const apiUrl = (window.GASC_CONFIG && window.GASC_CONFIG.getApiUrl)
          ? window.GASC_CONFIG.getApiUrl('/auth/student-login')
          : 'https://gasc-idappadi-sports.onrender.com/api/auth/student-login';

        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registerNumber: regno, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('gasc_token', data.token);
          localStorage.setItem('gasc_user', JSON.stringify(data.user));
          showAlert('✅ Login successful! Loading dashboard...', 'success');
          setTimeout(() => location.replace('student-dashboard.html'), 600);
        } else {
          showAlert('❌ ' + (data.message || 'Invalid credentials'), 'error');
          btn.disabled = false; txt.style.display = 'block'; sp.style.display = 'none';
        }
      } catch(err) {
        showAlert('⚠️ Server connection error. Check internet.', 'error');
        btn.disabled = false; txt.style.display = 'block'; sp.style.display = 'none';
      }
    }

    function showForgot() { document.getElementById('forgotModal').classList.add('show'); }
    function closeForgot() { document.getElementById('forgotModal').classList.remove('show'); }

    async function sendReset() {
      const id = document.getElementById('reset-id').value.trim();
      const alertEl = document.getElementById('reset-alert');
      if (!id) { alertEl.className='alert alert-error'; alertEl.textContent='Enter Register Number or Email.'; return; }
      alertEl.className='alert alert-success'; alertEl.textContent='Sending OTP...';
      try {
        const apiUrl = (window.GASC_CONFIG && window.GASC_CONFIG.getApiUrl)
          ? window.GASC_CONFIG.getApiUrl('/auth/forgot-password')
          : 'https://gasc-idappadi-sports.onrender.com/api/auth/forgot-password';
        const res = await fetch(apiUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({identifier: id}) });
        const data = await res.json();
        alertEl.className = res.ok ? 'alert alert-success' : 'alert alert-error';
        alertEl.textContent = data.message || (res.ok ? 'OTP sent!' : 'Failed');
      } catch(e) { alertEl.className='alert alert-error'; alertEl.textContent='Network error.'; }
    }
  </script>
</body>
</html>
